name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ls $ANDROID_HOME/platforms $ANDROID_HOME/build-tools || true

      - name: Build
        run: gradle --no-daemon --stacktrace assembleDebug assembleRelease

      - name: Rename
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/BMW_DIAG_beta-debug.apk
          cp app/build/outputs/apk/release/app-release.apk out/BMW_DIAG_beta.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BMW_DIAG_beta-apk
          path: out/*.apk
