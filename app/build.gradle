plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tms.bmwediag'
    compileSdk 35

    defaultConfig {
        applicationId 'com.tms.bmwdiag'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '0.9-beta'
    }

    signingConfigs {
        tms {
            storeFile file('tms-beta.jks')
            storePassword 'tmsbeta123'
            keyAlias 'tms'
            keyPassword 'tmsbeta123'
        }
    }

    buildTypes {
        debug { if (file('tms-beta.jks').exists()) signingConfig signingConfigs.tms }
        release {
            minifyEnabled false
            signingConfig file('tms-beta.jks').exists() ? signingConfigs.tms : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError false }
}
